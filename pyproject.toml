[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "haplens"
version = "0.1.0"
description = "HapLens: multi-scale haplotype association for family-structured populations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Linyong Shen (申林用)"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
haplens = "haplens.cli:main"

[project.urls]
Repository = "https://github.com/shenlinyong/HapLens"
Issues = "https://github.com/shenlinyong/HapLens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/haplens"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701", "E702", "E731", "E741"]
